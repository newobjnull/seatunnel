env {
  parallelism = 1
  job.mode = "BATCH"

  # You can set spark configuration here
  spark.app.name = "SeaTunnel"
  spark.executor.instances = 1
  spark.executor.cores = 1
  spark.executor.memory = "1g"
  spark.master = local
}

source {
  SftpFile {
    path = "tmp/seatunnel/read/excel"
    plugin_output = "sftp_keyfile_with_passphrase"
    file_format_type = excel
    host = "sftp"
    port = 22
    user = seatunnel
    keyfile = ""
    keyfile_passphrase = "123456"
    field_delimiter = ";"
    skip_header_row_number = 1
    schema = {
      fields {
        c_map = "map<string, string>"
        c_array = "array<int>"
        c_string = string
        c_boolean = boolean
        c_tinyint = tinyint
        c_smallint = smallint
        c_int = int
        c_bigint = bigint
        c_float = float
        c_double = double
        c_bytes = bytes
        c_date = date
        c_decimal = "decimal(38, 18)"
        c_timestamp = timestamp
        c_row = {
          c_map = "map<string, string>"
          c_array = "array<int>"
          c_string = string
          c_boolean = boolean
          c_tinyint = tinyint
          c_smallint = smallint
          c_int = int
          c_bigint = bigint
          c_float = float
          c_double = double
          c_bytes = bytes
          c_date = date
          c_decimal = "decimal(38, 18)"
          c_timestamp = timestamp
        }
      }
    }
  }
}

sink {
  SftpFile {
      host = "sftp"
      port = 22
      user = seatunnel
      keyfile = ""
      path = "/tmp/seatunnel/excel_by_keyfile"
      plugin_input = "sftp_keyfile_with_passphrase"
      partition_dir_expression = "${k0}=${v0}"
      is_partition_field_write_in_file = true
      file_name_expression = "${transactionId}_${now}"
      file_format_type = "excel"
      filename_time_format = "yyyy.MM.dd"
      is_enable_transaction = true
    }
}











